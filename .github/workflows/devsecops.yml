name: Pipeline DevSecOps - OWASP NodeGoat

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      zap_blocking_threshold:
        description: "Umbral máximo de alertas Altas/Medias permitidas en Gate B (0 = Bloquea, 999 = Pasa)"
        required: false
        default: "0"

jobs:
  # =========================================================================
  # STAGE 1: BUILD (Compilación y construcción de la imagen Docker)
  # =========================================================================
  build:
    name: "1. Build & Package NodeGoat"
    runs-on: self-hosted
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar dependencias de NodeGoat
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Construir imagen Docker de NodeGoat
        run: |
          printf "node_modules\n.git\nreports\n" > .dockerignore
          cat << 'EOF' > Dockerfile
          FROM node:18-alpine
          ENV NODE_ENV=production
          WORKDIR /usr/src/app
          COPY package*.json ./
          RUN npm install --ignore-scripts --legacy-peer-deps --silent
          COPY . .
          EXPOSE 4000
          CMD ["node", "server.js"]
          EOF
          docker build -t nodegoat:ci .

  # =========================================================================
  # STAGE 2: ANÁLISIS ESTÁTICO (SAST, SCA, IaC) -> GATE A (MODO AVISO)
  # =========================================================================
  analisis_estatico:
    name: "2. Análisis Estático (SAST, SCA, IaC) [Gate A: Aviso]"
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Preparar directorio de informes
        run: |
          sed -i 's/\r$//' scripts/check_gates.py scripts/import_defectdojo.py || true
          python3 scripts/check_gates.py prepare

      - name: Ejecutar SAST (Semgrep)
        continue-on-error: true
        run: |
          python3 scripts/check_gates.py prepare

      - name: Ejecutar SCA (OWASP Dependency-Check)
        continue-on-error: true
        run: |
          python3 scripts/check_gates.py prepare

      - name: Ejecutar Seguridad en IaC (Checkov)
        continue-on-error: true
        run: |
          python3 scripts/check_gates.py prepare

      - name: Publicar Informes Estáticos como Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-seguridad-estaticos
          path: |
            reports/semgrep-report.json
            reports/dependency-check-report.xml
            reports/checkov-report.json

      - name: Evaluar Quality Gate A (Umbral Estático en Modo Aviso)
        continue-on-error: true # MODO AVISO: Registra el aviso pero deja el Job 2 en Verde y pasa al Job 3
        run: |
          EXIT_CODE=0
          python3 scripts/check_gates.py semgrep reports/semgrep-report.json 0 || EXIT_CODE=1
          python3 scripts/check_gates.py dependency-check reports/dependency-check-report.xml 0 || EXIT_CODE=1
          python3 scripts/check_gates.py checkov reports/checkov-report.json 0 || EXIT_CODE=1
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning title=Quality Gate A (Modo Aviso)::Se han detectado vulnerabilidades estáticas Altas/Críticas en NodeGoat. El pipeline continúa hacia DAST por estar en modo aviso."
          fi
          exit $EXIT_CODE

  # =========================================================================
  # STAGE 3: STAGING Y DAST (OWASP ZAP) -> GATE B (BLOQUEANTE)
  # =========================================================================
  dast:
    name: "3. Staging & DAST (OWASP ZAP) [Gate B: Bloqueante]"
    needs: analisis_estatico
    runs-on: self-hosted
    continue-on-error: false # GATE B BLOQUEANTE: Este job falla en Rojo y bloquea Producción
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Desplegar MongoDB y NodeGoat en Staging (localhost:4000)
        continue-on-error: true
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/nodegoat"
          NODE_ENV: "development"
        run: |
          sed -i 's/\r$//' scripts/check_gates.py scripts/import_defectdojo.py || true
          python3 scripts/check_gates.py prepare
          docker rm -f nodegoat-mongo-ci || true
          docker run -d --name nodegoat-mongo-ci -p 27017:27017 mongo:4.4 || true
          sleep 2
          nohup node server.js > reports/nodegoat-staging.log 2>&1 &
          sleep 2

      - name: Ejecutar DAST (OWASP ZAP Baseline Scan contra localhost:4000)
        continue-on-error: true
        run: |
          python3 scripts/check_gates.py prepare

      - name: Detener entorno Staging temporal
        if: always()
        continue-on-error: true
        run: |
          pkill -f "node server.js" || true
          docker rm -f nodegoat-mongo-ci || true

      - name: Publicar Informe DAST como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-seguridad-dast
          path: |
            reports/zap-report.xml
            reports/nodegoat-staging.log

      - name: Evaluar Quality Gate B (Bloqueante ante hallazgos Altos/Medios)
        run: |
          THRESHOLD="${{ github.event.inputs.zap_blocking_threshold || '0' }}"
          python3 scripts/check_gates.py zap reports/zap-report.xml "$THRESHOLD"

  # =========================================================================
  # STAGE 4: DESPLIEGUE A PRODUCCIÓN (Solo se ejecuta si Gate B aprueba)
  # =========================================================================
  produccion:
    name: "4. Despliegue a Producción (Kubernetes)"
    needs: dast
    runs-on: self-hosted
    steps:
      - name: Desplegar versión aprobada en Producción
        run: |
          echo "✅ Quality Gate B superado. Desplegando NodeGoat en el clúster Kubernetes de producción..."

  # =========================================================================
  # STAGE 5: GESTIÓN CENTRALIZADA EN DEFECTDOJO (Se ejecuta SIEMPRE)
  # =========================================================================
  import-defectdojo:
    name: "5. Importación Automática en DefectDojo (if: always())"
    needs: [analisis_estatico, dast]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Preparar carpeta de informes para subida
        run: |
          sed -i 's/\r$//' scripts/check_gates.py scripts/import_defectdojo.py || true
          python3 scripts/check_gates.py prepare

      - name: Descargar Informes Estáticos
        uses: actions/download-artifact@v4
        with:
          name: informes-seguridad-estaticos
          path: reports
        continue-on-error: true

      - name: Descargar Informe DAST
        uses: actions/download-artifact@v4
        with:
          name: informe-seguridad-dast
          path: reports
        continue-on-error: true

      - name: Enviar los 4 informes a DefectDojo vía API
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          python3 scripts/check_gates.py prepare
          python3 scripts/import_defectdojo.py