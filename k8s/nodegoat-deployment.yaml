apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodegoat-deployment
  labels:
    app: nodegoat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodegoat
  template:
    metadata:
      labels:
        app: nodegoat
    spec:
      containers:
        - name: nodegoat
          image: nodegoat:latest
          ports:
            - containerPort: 4000
          securityContext:
            runAsNonRoot: false
            privileged: true